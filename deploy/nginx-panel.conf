# nginx для веб-панели — то, что стоит на боевой машине. Установка:
#   cp deploy/panel-ratelimit.conf /etc/nginx/conf.d/
#   cp deploy/nginx-panel.conf /etc/nginx/sites-available/elschedule.conf
#   ln -s /etc/nginx/sites-available/elschedule.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Сертификат: certbot --nginx -d elschedule.ru -d www.elschedule.ru
#
# ВАЖНО: этот файл ставит один прокси перед приложением, поэтому в .env должно быть
#   PANEL_TRUSTED_PROXIES=1
# Иначе панель не будет доверять X-Forwarded-For и все клиенты для rate-limit
# сольются в один IP (127.0.0.1). И наоборот: если nginx убрать, значение
# обязательно вернуть в 0, иначе IP можно подделать заголовком.

# HTTP → HTTPS, но acme-челлендж оставляем на HTTP для обновления сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name elschedule.ru www.elschedule.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Чужой Host на 80-м порту закрываем совсем: панель не должна отвечать на
# сканеры, которые ходят по IP, — иначе она попадает в чужие выдачи и логи.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Основной сервер.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elschedule.ru www.elschedule.ru;

    ssl_certificate     /etc/letsencrypt/live/elschedule.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elschedule.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Здесь намеренно нет add_header Content-Security-Policy. add_header не заменяет
    # заголовок приложения, а добавляет второй — браузер применяет обе политики
    # сразу, и фрейм должен быть разрешён каждой. Ровно так Mini App и перестал
    # открываться: в nginx список frame-ancestors отстал от приложения (не было
    # vk.ru) и блокировал встраивание внутри VK. Единственный источник правды —
    # web_panel._security_headers(). Проверка: tools/check_miniapp.py.

    # Держим в согласии с PANEL_MAX_UPLOAD_MB в .env (сейчас 25).
    # Меньше, чем в приложении, — и вместо понятной ошибки пользователь получит
    # 413 от nginx, не дойдя до панели.
    client_max_body_size 25M;

    # Панель когда-то жила на /panel — старые ссылки не должны отдавать 404.
    location ~ ^/panel(/.*)?$ {
        return 301 https://$host$1$is_args$args;
    }

    # Грубый предохранитель на весь сервер: панель работает в одном процессе,
    # и залить его запросами проще, чем кажется. Тонкий лимит (по маршрутам и
    # попыткам входа) живёт в самом приложении — PANEL_RATE_LIMIT_RPM.
    # Зона объявлена в deploy/panel-ratelimit.conf.
    limit_req zone=panel_rl burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

# Чужой SNI на 443 — тоже 444. Сертификат указан потому, что без него nginx
# не может завершить handshake и выдал бы ошибку TLS вместо тихого обрыва.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/elschedule.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elschedule.ru/privkey.pem;
    return 444;
}
