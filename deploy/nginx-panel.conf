# nginx для веб-панели. Установка:
#   cp deploy/nginx-panel.conf /etc/nginx/sites-available/vkpanel
#   ln -s /etc/nginx/sites-available/vkpanel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Сертификат: certbot --nginx -d elschedule.ru
#
# ВАЖНО: этот файл ставит один прокси перед приложением, поэтому в .env должно быть
#   PANEL_TRUSTED_PROXIES=1
# Иначе панель не будет доверять X-Forwarded-For и все клиенты для rate-limit
# сольются в один IP (127.0.0.1). И наоборот: если nginx убрать, значение
# обязательно вернуть в 0, иначе IP можно подделать заголовком.

server {
    listen 80;
    server_name elschedule.ru;

    # ACME-челлендж оставляем на HTTP, остальное — на HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name elschedule.ru;

    ssl_certificate     /etc/letsencrypt/live/elschedule.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elschedule.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Загрузка расписания: держим в согласии с PANEL_MAX_UPLOAD_MB (по умолчанию 16)
    client_max_body_size 16m;

    # Здесь намеренно нет add_header Content-Security-Policy. add_header не заменяет
    # заголовок приложения, а добавляет второй — браузер применяет обе политики
    # сразу, и фрейм должен быть разрешён каждой. Ровно так Mini App и перестал
    # открываться: в nginx список frame-ancestors отстал от приложения (не было
    # vk.ru) и блокировал встраивание внутри VK. Единственный источник правды —
    # web_panel._security_headers().

    access_log /var/log/nginx/vkpanel.access.log;
    error_log  /var/log/nginx/vkpanel.error.log;

    # Проверка живости для монитора: 200 — всё тикает, 503 — воркер встал.
    # Из общего access-лога убираем, иначе он состоит из одних пингов.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
