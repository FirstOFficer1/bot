# Зона счётчиков для limit_req из nginx-panel.conf.
#   cp deploy/panel-ratelimit.conf /etc/nginx/conf.d/
#
# Объявлять зону можно только в http-контексте, поэтому она лежит отдельным
# файлом в conf.d, а не рядом с server {} — забыть его при переносе значит
# получить «unknown limit_req zone "panel_rl"» и не поднять nginx вообще.
#
# 10r/s на IP при burst=20 — это про защиту процесса от заливки запросами,
# а не про подбор кода: попытки входа считает сама панель (PANEL_RATE_LIMIT_RPM),
# и там лимит по маршруту, а не по всему сайту.
limit_req_zone $binary_remote_addr zone=panel_rl:10m rate=10r/s;
