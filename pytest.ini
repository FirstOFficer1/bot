[pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# ВАЖНО: побеждает ПОСЛЕДНИЙ подходящий фильтр, поэтому `default` идёт первым.
# Когда он стоял в конце, он перекрывал оба error-фильтра, и защита не работала:
# тест с утечкой соединения проходил с предупреждением вместо падения.
filterwarnings =
    default
    error::DeprecationWarning:vkbot.*
    # Незакрытое sqlite-соединение на Windows блокирует удаление файла БД —
    # этим уже дважды ломалось превью загрузки. Пусть падает тест, а не прод.
    # ResourceWarning прилетает из сборщика мусора, и pytest заворачивает его
    # в свой PytestUnraisableExceptionWarning — ловить надо именно этот класс,
    # одного error::ResourceWarning недостаточно.
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
