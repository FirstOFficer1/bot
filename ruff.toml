# Линтер настроен узко и намеренно: правила, которые ловят настоящие ошибки,
# а не стиль. Цель — зелёный прогон на каждом push, а не переписывание кода
# под чужие вкусы. Расширять набор стоит по одному правилу за раз, вместе с
# правками, которые оно требует.

target-version = "py310"
line-length = 100

# Легаси-монолит Telegram-бота не поддерживается и не расширяется (см. CLAUDE.md),
# гонять по нему линтер бессмысленно — он останется красным навсегда.
exclude = ["bot.py", ".venv", "schedule_versions"]

[lint]
select = [
    "F",    # pyflakes: неиспользуемые импорты и переменные, опечатки в именах
    "E4",   # ошибки импортов
    "E7",   # множественные операторы в строке, сравнения с None/True
    "E9",   # синтаксис и не разбираемые файлы
    "PLE",  # ошибки pylint, включая невидимые символы в исходнике
]

[lint.per-file-ignores]
# В панели импорты идут после создания app и настройки логирования: порядок
# осмысленный (CSRF и security-заголовки вешаются сразу на app), менять его
# ради линтера дороже, чем польза от правила.
"web_panel.py" = ["E402"]
